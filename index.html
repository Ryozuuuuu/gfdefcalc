<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEF Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: settings → two build cards → sticky live bar → debuff sections (classes, weapons, items) on one page */
  :root {
    --bg: #030305;
    --panel: #0a0a0c;
    --field: #000000;
    --border: #1f1f24;
    --border-active: #3f3f46;
    --text-main: #ffffff;
    --text-muted: #8a8a94;
    --violet: #a855f7;
    --violet-glow: rgba(168, 85, 247, 0.2);
    --red: #ff003c;
    --red-soft: rgba(255, 0, 60, 0.08);
    --red-glow: rgba(255, 0, 60, 0.15);
    --cyan: #38bdf8;
    --cyan-soft: rgba(56, 189, 248, 0.08);
    --ok: #22c55e;
    --grid-line: rgba(255, 255, 255, 0.02);
    --f-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text-main); font-family: var(--f-display);
    padding-block: 32px 60px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .app { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .header { border-bottom: 2px solid var(--border); padding-bottom: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .header h1 span { color: var(--violet); }
  .header p { color: var(--text-muted); font-size: 13px; }

  .top-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); padding: 16px 18px; position: relative; min-width: 0; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--violet); }
  .stat-card.debuff::before { background: var(--red); }
  .stat-card label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-card .row { display: flex; align-items: baseline; gap: 6px; }
  .stat-card input { width: 100%; min-width: 0; background: transparent; border: none; color: var(--text-main); font-family: var(--f-mono); font-size: 26px; font-weight: 700; outline: none; }
  .stat-card.debuff input { color: var(--red); }
  .stat-card .unit { font-family: var(--f-mono); font-size: 16px; font-weight: 700; color: var(--text-muted); }
  .stat-card .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-family: var(--f-mono); }
  .stat-card:focus-within { border-color: var(--border-active); }

  /* builds */
  .builds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .build-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; min-width: 0; }
  .build-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 18px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .build-title { position: relative; }
  .bclear { position: absolute; right: 0; top: -6px; padding: 4px 10px; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--text-muted); }
  .bclear:hover { color: var(--text-main); }
  .build-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .build-inputs .full { grid-column: span 2; }
  .build-inputs label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
  .build-inputs input { width: 100%; background: var(--field); border: 1px solid var(--border); padding: 11px; color: var(--text-main); font-family: var(--f-mono); font-size: 16px; font-weight: 600; outline: none; border-radius: 6px; }
  .build-inputs input:focus { border-color: var(--violet); }
  .build-inputs .full input { border-color: rgba(56,189,248,.35); color: var(--cyan); }
  .eff { grid-column: span 2; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-family: var(--f-mono); font-size: 12px; color: var(--violet); }
  .eff .pen { color: var(--cyan); }
  .eff.neg .em { color: var(--red); }
  .result-box { margin-top: auto; background: var(--field); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
  .result-box::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--violet); }
  .result-box.danger::after { background: var(--red); }
  .result-grid { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .result-item { flex: 1; min-width: 0; }
  .result-item:first-child { border-right: 1px solid var(--border); padding-right: 16px; }
  .result-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .result-value { font-family: var(--f-mono); font-size: 32px; font-weight: 800; color: var(--violet); text-shadow: 0 0 20px var(--violet-glow); overflow-wrap: anywhere; }
  .result-value.secondary { font-size: 22px; color: var(--text-muted); text-shadow: none; }
  .result-box.danger .result-value:not(.secondary) { color: var(--red); text-shadow: 0 0 20px var(--red-glow); }

  /* sticky live bar */
  .livebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(10,10,12,.92); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .livebar .lb-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-right: auto; }
  .badge { font-family: var(--f-mono); font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
  .badge.def { color: var(--red); background: var(--red-soft); border-color: rgba(255,0,60,0.35); }
  .badge.ap { color: var(--cyan); background: var(--cyan-soft); border-color: rgba(56,189,248,0.35); }
  .mini { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .mini b { font-family: var(--f-mono); font-size: 15px; color: var(--violet); }
  .mini.bad b { color: var(--red); }
  .btn { background: var(--field); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--border-active); }

  /* debuff sections */
  .section { display: flex; flex-direction: column; gap: 12px; }
  .section-head { display: flex; align-items: baseline; gap: 12px; padding: 0 2px; }
  .section-head h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
  .section-head span { font-size: 12px; color: var(--text-muted); }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .group.wide { grid-column: 1 / -1; }
  .group-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .group-head h3 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .group-head h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .cicon { width: 26px; height: 26px; display: grid; place-items: center; }
  .cicon img { max-width: 26px; max-height: 26px; }
  .gtoggle { cursor: pointer; user-select: none; border-radius: 6px; padding: 2px 6px 2px 2px; margin-left: -2px; transition: background .15s, color .15s; }
  .gtoggle:hover { background: rgba(255,255,255,.06); color: var(--violet); }
  .gsum { font-family: var(--f-mono); font-size: 12px; color: var(--text-muted); }
  .gsum b { color: var(--red); }
  .who { font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; }
  [data-sec="classes"] .groups { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  [data-sec="classes"] .group { padding: 14px 12px; }
  [data-sec="classes"] .items { grid-template-columns: 1fr; }
  [data-sec="classes"] .item { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; padding: 7px 10px 7px 7px; }
  [data-sec="classes"] .icon { width: 36px; height: 36px; }
  [data-sec="classes"] .item .nm { font-size: 13px; }
  @media (max-width: 1150px) { [data-sec="classes"] .groups { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }
  .subhead { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 16px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .subhead + .items { margin-top: 10px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-top: 12px; }

  .item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--field); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 8px 8px; color: var(--text-main); transition: border-color .15s, background .15s, transform .1s; }
  .item:hover { border-color: var(--border-active); }
  .item:active { transform: scale(.98); }
  .item[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); box-shadow: inset 0 0 12px rgba(255,0,60,0.08); }
  .item.ap[aria-pressed="true"] { border-color: var(--cyan); background: var(--cyan-soft); box-shadow: inset 0 0 12px rgba(56,189,248,0.08); }
  .icon { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 800; color: #fff; overflow: hidden; border: 1px solid rgba(255,255,255,.08); background: #111; }
  .icon img { width: 32px; height: 32px; image-rendering: auto; }
  .item[aria-pressed="false"] .icon img { filter: saturate(.75) brightness(.9); }
  .item .nm { font-size: 14px; font-weight: 600; line-height: 1.2; min-width: 0; }
  .item .nm small { display: block; font-size: 11px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
  .item .v { font-family: var(--f-mono); font-size: 14px; font-weight: 700; color: var(--red); white-space: nowrap; }
  .item.ap .v { color: var(--cyan); }
  .item .v small { font-size: 10px; opacity: .8; }

  @media (max-width: 860px) { .builds-grid { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .top-stats { grid-template-columns: 1fr; } .groups { grid-template-columns: 1fr; } .items { grid-template-columns: 1fr; } .result-value { font-size: 26px; } .livebar .lb-title { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1><span>DEF</span> Calculator</h1>
  </div>

  <div class="top-stats">
    <div class="stat-card">
      <label for="enemyPen">Enemy Penetration</label>
      <div class="row"><input type="number" id="enemyPen" value="100"><span class="unit">%</span></div>
    </div>
    <div class="stat-card debuff">

      <div class="row"><input type="number" id="defDown" placeholder="0"><span class="unit">%</span></div>
      <div class="sub">anything not in the list below</div>
    </div>
  </div>

  <div class="builds-grid" id="builds"></div>

  <div class="livebar">
    <span class="lb-title">Enemy Debuffs</span>
    <span class="badge def" id="sumDef">−0% DEF</span>
    <span class="badge ap" id="sumAp">−0% Anti-Pen</span>
    <span class="mini" id="miniA">Current <b>0</b></span>
    <span class="mini" id="miniB">Proposed <b>0</b></span>
    <button class="btn" type="button" id="btnClear">Clear all</button>
  </div>

  <div id="sections" style="display:flex;flex-direction:column;gap:16px"></div>
</div>

const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const CAP = 10900;

const KEY = 'defcalc-v4';
let on = [];
const BUILDS = [
  { s:'A', title:'Current Build',  d:{ base:7078, bonus:17563, multi:4.98, flat:18026, anti:100 } },
  { s:'B', title:'Proposed Build', d:{ base:5000, bonus:17563, multi:5.50, flat:18026, anti:100 } },
];
const FIELDS = ['enemyPen','defDown', ...BUILDS.flatMap(b => ['base','bonus','multi','flat','anti'].map(k => k+b.s))];

function initials(n){ const w=n.replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean); const num=w.find(x=>/^\d+$/.test(x)); const word=w.find(x=>!/^\d+$/.test(x))||''; return (num||'')+(word[0]||'').toUpperCase(); }

function sortList(list, g){
  if (g.sec!=='classes') return list;
  return [...list].sort((a,b)=>(a.t==='ap')-(b.t==='ap') || b.v-a.v);
}
function itemsBlock(list, tile){
  const subs=[...new Set(list.map(i=>i.sub).filter(Boolean))];
  if(!subs.length) return `<div class="items">${list.map(tile).join('')}</div>`;
  return subs.map(sb=>`<div class="subhead">${sb}</div><div class="items">${list.filter(i=>i.sub===sb).map(tile).join('')}</div>`).join('');
}
function renderSections(){
  document.getElementById('sections').innerHTML = SECTIONS.map(sec => `<section class="section" data-sec="${sec.id}">
    
    <div class="groups">${GROUPS.filter(g=>g.sec===sec.id).map(g => `<div class="group${g.wide?' wide':''}">
      <div class="group-head"><h3 class="gtoggle" data-gtoggle="${g.id}" title="Click to switch all on / off" role="button" tabindex="0">${CLASS_ICONS[g.id]?`<span class="cicon"><img src="${CLASS_ICONS[g.id]}" alt=""></span>`:`<i style="background:${g.color}"></i>`}${g.name}</h3><span class="gsum" data-gsum="${g.id}"></span></div>
      
      ${itemsBlock(sortList(ITEMS.filter(i=>i.groups.includes(g.id)), g), it => `<button type="button" class="item${it.t==='ap'?' ap':''}" data-id="${it.id}" aria-pressed="false">
        <span class="icon">${IMAGES[it.id]?`<img src="${IMAGES[it.id]}" alt="">`:initials(it.name)}</span>
        <span class="nm">${it.name}${it.note?`<small>${it.note}</small>`:''}</span>
        <span class="v">−${it.v}%${it.t==='ap'?' <small>AP</small>':''}</span></button>`)}
    </div>`).join('')}</div></section>`).join('');
}
function renderBuilds(){
  document.getElementById('builds').innerHTML = BUILDS.map(b => `<div class="build-card">
    <div class="build-title">${b.title}<button class="btn bclear" type="button" data-bclear="${b.s}">Clear</button></div>
    <div class="build-inputs">
      <div><label for="base${b.s}">Base DEF</label><input type="number" id="base${b.s}" value="${b.d.base}"></div>
      <div><label for="bonus${b.s}">Bonus DEF</label><input type="number" id="bonus${b.s}" value="${b.d.bonus}"></div>
      <div><label for="multi${b.s}">Multiplier</label><input type="number" id="multi${b.s}" value="${b.d.multi}" step="0.01"></div>
      <div><label for="flat${b.s}">Flat Bonus</label><input type="number" id="flat${b.s}" value="${b.d.flat}"></div>
      <div class="full"><label for="anti${b.s}">Your Anti-Pen %</label><input type="number" id="anti${b.s}" value="${b.d.anti}"></div>
      <div class="eff" id="eff${b.s}"><span>Eff. Multi: <b class="em">0</b></span></div>
    </div>
    <div class="result-box" id="res${b.s}">
      <div class="result-grid">
        <div class="result-item"><div class="result-label">Original DEF</div><div class="result-value secondary" id="raw${b.s}">0</div></div>
        <div class="result-item"><div class="result-label">Final DEF</div><div class="result-value" id="final${b.s}">0</div></div>
      </div>
    </div>
  </div>`).join('');
}

const num = id => parseFloat(document.getElementById(id).value) || 0;
const fmt = n => Math.round(n).toLocaleString('en-US');
function totals(ids){ let def=0, ap=0; for (const id of new Set(ids)) { const it=byId[id]; if(!it) continue; if (it.t==='ap') ap+=it.v; else def+=it.v; } return { def, ap }; }

function calc(){
  const set=new Set(on); const t=totals(on); const def=t.def+num('defDown');
  document.getElementById('sumDef').textContent=`−${def}% DEF`;
  document.getElementById('sumAp').textContent=`−${t.ap}% Anti-Pen`;
  document.querySelectorAll('.item').forEach(el=>el.setAttribute('aria-pressed', set.has(el.dataset.id)));
  GROUPS.forEach(g=>{ const tt=totals(ITEMS.filter(i=>i.groups.includes(g.id)&&set.has(i.id)).map(i=>i.id));
    document.querySelector(`[data-gsum="${g.id}"]`).innerHTML = [tt.def?`<b>−${tt.def}%</b>`:'', tt.ap?`<span style="color:var(--cyan)">−${tt.ap}% AP</span>`:''].filter(Boolean).join(' · '); });

  BUILDS.forEach(({s,title})=>{
    const br=num('base'+s)+num('bonus'+s), multi=num('multi'+s), flat=num('flat'+s);
    const anti=num('anti'+s)-t.ap, penLeft=Math.max(0,Math.min(100,num('enemyPen')-anti));
    const eff=multi-def/100, raw=br*multi+flat;
    const final=Math.max(0,(br*eff+flat)*(1-penLeft/100));
    const e=document.getElementById('eff'+s); e.classList.toggle('neg', eff<0);
    e.querySelector('.em').textContent=eff.toFixed(2);
    document.getElementById('raw'+s).textContent=fmt(raw);
    document.getElementById('final'+s).textContent=fmt(final);
    document.getElementById('res'+s).classList.toggle('danger', final<CAP);
    const mini=document.getElementById('mini'+s); mini.classList.toggle('bad', final<CAP);
    mini.innerHTML=`${title.split(' ')[0]} <b>${fmt(final)}</b>`;
  });
  try{ const f={}; FIELDS.forEach(id=>f[id]=document.getElementById(id).value); localStorage.setItem(KEY, JSON.stringify({ on, f })); }catch(e){}
}

renderBuilds(); renderSections();
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s){ on=(s.on||[]).filter(id=>byId[id]); if(s.f) FIELDS.forEach(id=>{ if(s.f[id]!=null) document.getElementById(id).value=s.f[id]; }); } }catch(e){}
function toggleGroup(gid){ const ids=ITEMS.filter(i=>i.groups.includes(gid)).map(i=>i.id); const all=ids.every(id=>on.includes(id));
  on = all ? on.filter(id=>!ids.includes(id)) : [...new Set([...on, ...ids])]; calc(); }
document.getElementById('sections').addEventListener('keydown', e=>{ const h=e.target.closest('[data-gtoggle]'); if(h && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); toggleGroup(h.dataset.gtoggle); } });
document.getElementById('sections').addEventListener('click', e=>{
  const h=e.target.closest('[data-gtoggle]'); if(h){ toggleGroup(h.dataset.gtoggle); return; }
  const b=e.target.closest('.item'); if(!b) return; const id=b.dataset.id;
  on = on.includes(id) ? on.filter(x=>x!==id) : [...on, id]; calc();
});
document.getElementById('btnClear').onclick=()=>{ on=[]; calc(); };
document.getElementById('builds').addEventListener('click', e=>{ const b=e.target.closest('[data-bclear]'); if(!b) return;
  ['base','bonus','multi','flat','anti'].forEach(k=>document.getElementById(k+b.dataset.bclear).value=''); calc(); });
document.addEventListener('input', e=>{ if(FIELDS.includes(e.target.id)) calc(); });
calc();
</script>
</body>
</html>
